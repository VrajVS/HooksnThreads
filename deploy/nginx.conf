# Serves the built SPA and proxies the API. Sits behind the server's shared
# reverse proxy (which terminates HTTPS), so forwarded headers are passed on.

# Keep the original scheme/host from the outer proxy; fall back to our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ""      $host;
}

upstream hnt_api {
    server api:4000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Admin image uploads are capped at 5 MB by the API.
    client_max_body_size 6m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://hnt_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://hnt_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vite's hashed build output never changes under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location /images/ {
        expires 30d;
        add_header Cache-Control "public" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Client-side routes (/products, /admin/orders/12, ...) all load the SPA.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
